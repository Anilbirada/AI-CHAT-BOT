services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dsce_ai
      POSTGRES_USER: dsce
      POSTGRES_PASSWORD: dsce
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dsce:dsce@db:5432/dsce_ai
      JWT_SECRET: change-me
      STORAGE_PATH: /app/storage/uploads
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes: ["./storage:/app/storage"]
    depends_on: [db]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
